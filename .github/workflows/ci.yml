name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fileops.nvim
      # docs/TESTS/run.lua hard-fails without lib.nvim on the runtimepath
      # (a real runtime dependency, not just optional) -- check it out as a
      # sibling so the run.lua's own sibling-checkout lookup (../lib.nvim)
      # finds it.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run docs/TESTS suite
        working-directory: fileops.nvim
        run: nvim --headless -i NONE -u NONE -c "set rtp+=." -c "luafile docs/TESTS/run.lua" -c "qa!"

  explorer-integration:
    name: tests (neo-tree + nvim-tree, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fileops.nvim
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
      # explorer_integration_spec.lua's own subject: exercises ops/file.lua's
      # explorer-refresh code path against REAL neo-tree.nvim/nvim-tree.lua
      # instances, not just the `package.loaded[...]`-guarded no-op the rest
      # of the suite exercises. Checked out as siblings, same lookup order
      # the spec itself uses (`$<NAME>_DIR` first, sibling checkout second) —
      # nui.nvim and plenary.nvim are neo-tree's own hard dependencies.
      - uses: actions/checkout@v4
        with:
          repository: nvim-neo-tree/neo-tree.nvim
          path: neo-tree.nvim
      - uses: actions/checkout@v4
        with:
          repository: nvim-tree/nvim-tree.lua
          path: nvim-tree.lua
      - uses: actions/checkout@v4
        with:
          repository: MunifTanjim/nui.nvim
          path: nui.nvim
      - uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run docs/TESTS suite (with explorer deps on rtp)
        working-directory: fileops.nvim
        run: nvim --headless -i NONE -u NONE -c "set rtp+=." -c "luafile docs/TESTS/run.lua" -c "qa!"

  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    # Was advisory while the one-time `stylua .` pass the existing style
    # predated was still outstanding. That pass has landed, `stylua --check .`
    # and `luacheck lua` both run clean, and leaving the job non-blocking would
    # only let the formatting drift back unnoticed.
    steps:
      - uses: actions/checkout@v4
      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          version: latest
          args: --check .
      - name: luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck lua
